<nav class="navbar navbar-dark navbar-expand-lg px-3">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="10" stroke="#22C55E"/>
        <path d="M12 2a15 15 0 010 20 15 15 0 010-20z" stroke="#22C55E"/>
        <line x1="2" y1="12" x2="22" y2="12" stroke="#22C55E"/>
      </svg>
      <span class="fw-bold">SoccerTournaments</span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="inicio" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="torneos">Torneos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="como-funciona">Cómo funciona</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="contacto">Contacto</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">
        @if (isAuthenticated()) {
          <div class="dropdown">
            <button class="btn-user dropdown-toggle d-flex align-items-center gap-2" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span class="user-name">{{ user()?.username || 'User' }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" routerLink="#">Perfil</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item text-danger" (click)="logout()">Cerrar sesión</button></li>
            </ul>
          </div>
        } @else {
          <a class="btn btn-sm btn-outline-light px-3" routerLink="/auth/login">Iniciar sesión</a>
          <a class="btn btn-sm btn-primary px-3" routerLink="/auth/login">Registrarse</a>
        }
      </div>
    </div>
  </div>
