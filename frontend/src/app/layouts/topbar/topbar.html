<header class="topbar">
  <div class="topbar-left">
    <h2 class="topbar-greeting">Bienvenido{{ user()?.username ? ', ' + user()?.username : '' }}</h2>
  </div>

  <div class="topbar-right">
    <div class="user-menu">
      <button class="user-button" (click)="toggleDropdown()" aria-label="Menú de usuario">
        <span class="user-avatar">{{ userInitial }}</span>
        <span class="user-name">{{ user()?.username }}</span>
        <svg class="chevron" [class.open]="showDropdown" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      @if (showDropdown) {
        <div class="dropdown-card">
          <a class="dropdown-item" routerLink="/dashboard" (click)="closeDropdown()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
            </svg>
            Dashboard
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item text-danger" (click)="logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>
</header>
