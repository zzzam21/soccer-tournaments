<div class="modal-overlay" (click)="onCancel.emit()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-content p-4 text-center">
      <div class="mb-3">
        <span class="icon-danger d-inline-flex align-items-center justify-content-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
          </svg>
        </span>
      </div>
      <h5 class="mb-2">Eliminar jugador</h5>
      <p class="text-muted-custom mb-4">
        ¿Estás seguro de eliminar a <strong>{{ playerName() }}</strong>?
        <br />El jugador será eliminado del equipo al que pertenece.
      </p>
      <div class="d-flex justify-content-center gap-2">
        <button type="button" class="btn btn-secondary" (click)="onCancel.emit()" [disabled]="deleting()">Cancelar</button>
        <button type="button" class="btn btn-danger" (click)="onConfirm.emit()" [disabled]="deleting()">
          @if (deleting()) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          Eliminar
        </button>
      </div>
    </div>
  </div>
</div>
