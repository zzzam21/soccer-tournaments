<div class="login-page">
  <div class="login-bg-decor"></div>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a15 15 0 010 20 15 15 0 010-20z"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2v20"/>
          <line x1="7" y1="5" x2="17" y2="19"/>
          <line x1="17" y1="5" x2="7" y2="19"/>
        </svg>
      </div>
      <h1 class="login-title">Iniciar sesión</h1>
      <p class="login-subtitle">Ingresa tus credenciales para acceder al panel</p>
    </div>

    @if (error(); as err) {
      <div class="login-alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <span>{{ err }}</span>
      </div>
    }

    <form class="login-form" #f="ngForm" (ngSubmit)="onSubmit(f.value.username, f.value.password)">
      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            #username="ngModel"
            id="username"
            name="username"
            type="text"
            class="form-control"
            placeholder="Tu nombre de usuario"
            ngModel
            required
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input
            #password="ngModel"
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            placeholder="Tu contraseña"
            ngModel
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showPassword) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn-login"
        [disabled]="loading() || f.invalid"
      >
        @if (loading()) {
          <span class="spinner"></span>
          Ingresando...
        } @else {
          Ingresar
        }
      </button>
    </form>

    <p class="login-footer-text">
      ¿No tienes cuenta?
      <a class="login-link" routerLink="/auth/register">Regístrate</a>
    </p>
  </div>
</div>
