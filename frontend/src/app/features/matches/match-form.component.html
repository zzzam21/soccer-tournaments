<div class="modal-overlay" (click)="cancel()">
  <div class="modal-content section-dark rounded-4 p-4" (click)="$event.stopPropagation()">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h3 class="modal-title mb-0">{{ title() }}</h3>
      <button class="btn-close-custom" (click)="cancel()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
          <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label" for="number">Número de Jornada</label>
        <input
          id="number"
          type="number"
          class="form-control"
          formControlName="number"
          min="1"
          placeholder="Ej: 1"
        />
      </div>

      <div class="mb-4">
        <label class="form-label" for="start_date">Fecha de Inicio</label>
        <input
          id="start_date"
          type="date"
          class="form-control"
          [class.is-invalid]="isFieldInvalid('start_date')"
          formControlName="start_date"
        />
        @if (isFieldInvalid('start_date') && form.get('start_date')?.hasError('minDate')) {
          <div class="invalid-feedback d-block">
            La fecha debe ser al menos 7 días después de la última jornada ({{ minDate() }})
          </div>
        }
      </div>

      <div class="d-flex gap-2 justify-content-end">
        <button type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="saving()">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary gradient-button" [disabled]="form.invalid || saving()">
          @if (saving()) {
            <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          }
          {{ submitLabel() }}
        </button>
      </div>
    </form>
  </div>
</div>
